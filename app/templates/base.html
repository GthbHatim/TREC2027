<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestió El Foix</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="static/css/foix.css">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@200..700&display=swap" rel="stylesheet">
</head>
<body>
<nav class="fixed bg-white/10 backdrop-blur-md border border-white/25 rounded-xl p-3 pt-6 shadow-xl w-full">
  <div class="max-w-screen-xl flex items-center justify-between mx-auto">
    <a href="https://agora.xtec.cat/ieselfoix/" class="image"><img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="h-10"></a>
    <ul class="flex space-x-8">
      <li>
        <a href="{{ url_for('benvingut') }}" class="hover:text-gray-300">Casa</a>
      </li>
      <li>
        <a href="{{ url_for('veure_ordinadors') }}" class="hover:text-gray-300">Ordinadors</a>
      </li>
      <li>
        <a href="{{ url_for('veure_alumnes') }}" class="hover:text-gray-300">Alumnes</a>  
      </li>
      <li>
        <a href="{{ url_for('veure_historial') }}" class="hover:text-gray-300">Historial</a>
      </li>
      <li>
        <a href="{{ url_for('exportar') }}" class="hover:text-gray-300">Exportar</a>
      </li>
    </ul>
  </div>
</nav>
<main class="pt-16">
{% block content %}
{% endblock %}
</main>
</body>
</html>
